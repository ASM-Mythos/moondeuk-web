<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>문득 — 복습 시작 화면</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; overflow:clip; background:transparent; }
  body { font-family:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
    display:flex; flex-direction:column; align-items:center; }

  .stage-wrap { flex:1; display:flex; align-items:flex-start; justify-content:center; width:100%; overflow-x:clip; overflow-y:visible; }
  .stage { width:393px; height:852px; transform-origin:top center; position:relative; }

  /* ── 폰 프레임: 이미지 베젤(iphone-frame.png) 오버레이, 스크린 393×852 ── */
  .phone { width:393px; height:852px; background:#F2E8D6; border-radius:48px; overflow:hidden; position:relative;
    display:flex; flex-direction:column; box-shadow:0 0 0 8px #F2E8D6; }  /* 베젤 안쪽 반투명 프린지 밑을 채우는 블리드 링 */
  .phone-frame { position:absolute; left:-25.7px; top:-26.7px; width:444.4px; height:904.4px; max-width:none;
    pointer-events:none; z-index:90; filter:drop-shadow(0 10px 18px rgba(47,38,22,.22)); }
  .statusbar { height:44px; flex-shrink:0; }             /* 상태바는 프레임 이미지에 구워져 있음 */
  .content { flex:1; overflow:hidden; padding:0 20px; position:relative; pointer-events:none; }

  .appbar { display:flex; align-items:center; gap:12px; margin-top:14px; }
  .appbar .circle { width:38px; height:38px; border-radius:50%; background:#fff; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 8px rgba(47,38,22,.06); flex-shrink:0; }
  .appbar .title { flex:1; text-align:center; font-size:18px; font-weight:800; color:#2F2616; letter-spacing:-0.3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .prog-card { margin-top:22px; background:#fff; border-radius:26px; padding:24px 22px 22px; box-shadow:0 2px 10px rgba(47,38,22,.05); }
  .prog-label { font-size:13.5px; font-weight:700; color:#8A7C64; }
  .prog-body { display:flex; align-items:center; gap:24px; margin-top:16px; padding:0 4px; }
  .ring-wrap { position:relative; width:132px; height:132px; flex-shrink:0; }
  .ring-wrap .pct { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:32px; font-weight:800; color:#2F2616; letter-spacing:-1px; }
  .prog-stats .total { font-size:22px; font-weight:800; color:#2F2616; letter-spacing:-0.4px; }
  .prog-stats .today { margin-top:7px; font-size:14px; font-weight:500; color:#8A7C64; }
  .review-cta { margin-top:22px; height:60px; border-radius:19px;
    background:linear-gradient(135deg,#D19A5B 0%,#9A6A30 100%); color:#fff; font-size:17px; font-weight:800;
    display:flex; align-items:center; justify-content:center; gap:9px; box-shadow:0 10px 22px rgba(154,106,48,.42); }

  .settings-card { margin-top:16px; background:#fff; border-radius:26px; padding:6px 20px; box-shadow:0 2px 10px rgba(47,38,22,.05); }
  .set-row { display:flex; align-items:center; gap:14px; padding:17px 0; }
  .set-row + .set-row { border-top:1px solid #F3EDE0; }
  .set-sq { width:48px; height:48px; border-radius:15px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .set-row .mid { flex:1; min-width:0; }
  .set-row .t { font-size:16px; font-weight:700; color:#2F2616; letter-spacing:-0.3px; }
  .set-row .d { font-size:12.5px; font-weight:500; color:#8A7C64; margin-top:3px; }
  .set-row .tail { display:flex; align-items:center; gap:5px; font-size:14px; font-weight:600; color:#8A7C64; }
  .toggle { width:52px; height:31px; border-radius:16px; background:#C0894A; position:relative; flex-shrink:0; }
  .toggle i { position:absolute; top:2.5px; right:2.5px; width:26px; height:26px; border-radius:50%; background:#fff; box-shadow:0 2px 5px rgba(0,0,0,.2); }

  /* ── 등장 + CTA 펄스 애니메이션 ── */
  .anim { opacity:0; transform:translateY(14px); animation:cardIn .6s ease forwards; }
  @keyframes cardIn { to { opacity:1; transform:none; } }
  .review-cta { animation:ctaPulse 2.2s ease-out 1s infinite; }
  @keyframes ctaPulse { 0% { box-shadow:0 10px 22px rgba(154,106,48,.42), 0 0 0 0 rgba(192,137,74,.45); }
    60% { box-shadow:0 10px 22px rgba(154,106,48,.42), 0 0 0 14px rgba(192,137,74,0); }
    100% { box-shadow:0 10px 22px rgba(154,106,48,.42), 0 0 0 0 rgba(192,137,74,0); } }
  @media (prefers-reduced-motion: reduce) {
    .anim { animation:none; opacity:1; transform:none; }
    .review-cta { animation:none; }
  }
</style>
</head>
<body>

<div class="stage-wrap"><div class="stage" id="stage"><div class="phone">
  <div class="statusbar"></div>
  <div class="content">
    <div class="appbar anim">
      <div class="circle"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#2F2616" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></div>
      <div class="title">2023 Java 중간 고사</div>
      <div class="circle"><svg width="19" height="19" viewBox="0 0 24 24" fill="#2F2616"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg></div>
    </div>

    <div class="prog-card anim" style="animation-delay:.15s">
      <div class="prog-label">학습 진척도</div>
      <div class="prog-body">
        <div class="ring-wrap">
          <svg width="132" height="132" viewBox="0 0 132 132"><circle cx="66" cy="66" r="58" fill="none" stroke="#EDE3CF" stroke-width="10"/></svg>
          <div class="pct">0%</div>
        </div>
        <div class="prog-stats">
          <div class="total">총 11문제</div>
          <div class="today">오늘 복습할 카드 11장</div>
        </div>
      </div>
      <div class="review-cta">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/></svg>
        복습 시작
      </div>
    </div>

    <div class="settings-card anim" style="animation-delay:.3s">
      <div class="set-row">
        <div class="set-sq" style="background:#F9EDDC"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#C0894A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="m9 13 2 2 4-4"/></svg></div>
        <div class="mid"><div class="t">문제 관리</div><div class="d">문제 확인 · 수정 · 삭제</div></div>
        <div class="tail">11문제
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#B6A68A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
        </div>
      </div>
      <div class="set-row">
        <div class="set-sq" style="background:#F5EBD7"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#B08D4F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg></div>
        <div class="mid"><div class="t">최근 복습</div><div class="d">마지막으로 푼 시각</div></div>
        <div class="tail">복습 전</div>
      </div>
      <div class="set-row">
        <div class="set-sq" style="background:#FBE7E2"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#D96B5C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v10"/><path d="M18.4 6.6a9 9 0 1 1-12.77.04"/></svg></div>
        <div class="mid"><div class="t">복습 활성화</div><div class="d">끄면 복습 대기열에서 제외되요</div></div>
        <div class="toggle"><i></i></div>
      </div>
    </div>
  </div>
</div><img class="phone-frame" src="../assets/iphone-frame.png" alt="" aria-hidden="true"></div></div>

<script>
// ── 뷰포트에 맞게 폰 스케일 (프레임 포함 444.4×904.4, 상단 오버행 26.7) ──
function fit() {
  var s = Math.min(1, (window.innerHeight - 14) / 905, (window.innerWidth - 16) / 445);
  var st = document.getElementById('stage');
  st.style.transform = 'scale(' + s + ')';
  st.style.marginTop = (26.7 * s + 6) + 'px';
}
window.addEventListener('resize', fit);
fit();
</script>
</body>
</html>
