<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>문득 — 자동 생성된 문제집 홈</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; overflow:clip; background:transparent; }
  body { font-family:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
    display:flex; flex-direction:column; align-items:center; }

  .stage-wrap { flex:1; display:flex; align-items:flex-start; justify-content:center; width:100%; overflow-x:clip; overflow-y:visible; }
  .stage { width:393px; height:852px; transform-origin:top center; position:relative; }

  /* ── 폰 프레임: 이미지 베젤(iphone-frame.png) 오버레이, 스크린 393×852 ── */
  .phone { width:393px; height:852px; background:#F2E8D6; border-radius:48px; overflow:hidden; position:relative;
    display:flex; flex-direction:column; box-shadow:0 0 0 8px #F2E8D6; }  /* 베젤 안쪽 반투명 프린지 밑을 채우는 블리드 링 */
  .phone-frame { position:absolute; left:-25.7px; top:-26.7px; width:444.4px; height:904.4px; max-width:none;
    pointer-events:none; z-index:90; filter:drop-shadow(0 10px 18px rgba(47,38,22,.22)); }
  .statusbar { height:44px; flex-shrink:0; }             /* 상태바는 프레임 이미지에 구워져 있음 */
  .content { flex:1; overflow:hidden; padding:0 20px; position:relative; pointer-events:none; }

  .greet-title { margin-top:12px; font-size:24px; font-weight:800; color:#2F2616; letter-spacing:-0.5px; padding-left:2px; white-space:nowrap; }
  .hero { margin-top:14px; border-radius:24px; padding:18px; position:relative; overflow:hidden;
    background:linear-gradient(135deg,#D19A5B 0%,#9A6A30 100%); box-shadow:0 10px 24px rgba(70,60,40,.2); }
  .hero-cap { font-size:12.5px; font-weight:600; color:rgba(255,255,255,.85); }
  .hero-title { font-size:24px; font-weight:800; color:#fff; margin-top:3px; letter-spacing:-0.4px; }
  .hero-total { font-size:16px; font-weight:700; color:rgba(255,255,255,.8); margin-left:2px; }
  .hero-progress { margin-top:10px; width:190px; height:6px; border-radius:4px; background:rgba(255,255,255,.35); overflow:hidden; }
  .hero-progress i { display:block; height:100%; border-radius:4px; background:#fff; width:76%; }
  .hero-cta { display:inline-flex; align-items:center; gap:5px; margin-top:12px; background:#fff; color:#9A6A30; font-size:14px; font-weight:800; padding:10px 16px; border-radius:22px; box-shadow:0 4px 10px rgba(0,0,0,.12); position:relative; }
  .hero-cat { position:absolute; right:10px; bottom:6px; width:98px; filter:drop-shadow(0 4px 8px rgba(0,0,0,.15)); }

  .week-card { margin-top:12px; background:#fff; border-radius:18px; padding:12px 14px; box-shadow:0 2px 10px rgba(47,38,22,.05); }
  .week-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:9px; }
  .week-title { font-size:14px; font-weight:800; color:#2F2616; }
  .streak { display:flex; align-items:center; gap:3px; font-size:12.5px; font-weight:700; color:#9A6A30; }
  .week-days { display:flex; justify-content:space-between; }
  .day { display:flex; flex-direction:column; align-items:center; gap:4px; }
  .day i { width:27px; height:27px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:#F0E9DB; }
  .day span { font-size:10.5px; font-weight:600; color:#8A7C64; }
  .day.done i { background:#C0894A; }
  .day.future i { background:transparent; border:1.5px dashed #DCD2BE; }
  .day.today i { box-shadow:0 0 0 3px rgba(192,137,74,.32); }
  .day.today span { color:#2F2616; font-weight:800; }

  .section { display:flex; justify-content:space-between; align-items:center; margin:18px 2px 12px; }
  .section h2 { font-size:19px; font-weight:800; color:#2F2616; }
  .add-quiz { display:inline-flex; align-items:center; gap:5px; background:#F5E7D0; color:#9A6A30; font-size:13px; font-weight:700; padding:8px 13px; border-radius:17px; border:1.5px solid #C0894A; }

  .rows { display:flex; flex-direction:column; gap:12px; }
  .row { background:#fff; border-radius:20px; padding:16px; display:flex; align-items:center; gap:14px; box-shadow:0 2px 10px rgba(47,38,22,.05); }
  .squircle { width:50px; height:50px; border-radius:16px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .row .mid { flex:1; min-width:0; }
  .row .fname { font-size:16px; font-weight:700; color:#2F2616; letter-spacing:-0.3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row .fcount { font-size:13px; font-weight:500; color:#8A7C64; margin-top:3px; }

  .row.generating { background:#FBF6EC; border:1px solid #E4D5B8; box-shadow:none; display:block; }
  .gen-head { display:flex; align-items:center; }
  .gen-cat { width:44px; height:44px; border-radius:50%; background:#fff; display:flex; align-items:center; justify-content:center; overflow:hidden; flex-shrink:0; box-shadow:0 2px 8px rgba(47,38,22,.08); }
  .gen-cat img { width:44px; height:44px; object-fit:cover; }
  .gen-head .mid { flex:1; min-width:0; padding-left:12px; }
  .gen-status { font-size:13px; font-weight:500; color:#C0894A; margin-top:3px; }
  .gen-progress { margin-top:14px; display:flex; align-items:center; }
  .gen-bar { flex:1; height:6px; border-radius:3px; background:#EDE3CF; overflow:hidden; }
  .gen-bar i { display:block; height:100%; width:0; border-radius:3px; background:#C0894A; transition:width .12s linear; }
  .gen-pct { font-size:13px; font-weight:500; color:#C0894A; padding-left:8px; min-width:38px; text-align:right; }

  .tabbar { height:74px; background:#fff; border-top:1px solid #EFE7D6; display:flex; align-items:flex-start; padding-top:11px; flex-shrink:0; }
  .tab { flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; font-size:11px; font-weight:600; color:#B6A68A; }
  .tab.active { color:#C0894A; font-weight:700; }

  /* ── 등장 애니메이션: 위→아래 순차 ── */
  .anim { opacity:0; transform:translateY(14px); animation:cardIn .6s ease forwards; }
  @keyframes cardIn { to { opacity:1; transform:none; } }
  @media (prefers-reduced-motion: reduce) {
    .anim { animation:none; opacity:1; transform:none; }
  }
</style>
</head>
<body>

<div class="stage-wrap"><div class="stage" id="stage"><div class="phone">
  <div class="statusbar"></div>
  <div class="content">
    <div class="greet-title anim">오늘도 한 걸음 더 나아가요!</div>
    <div class="hero anim" style="animation-delay:.15s">
      <div class="hero-cap">오늘의 복습</div>
      <div class="hero-title">32<span class="hero-total">/42 문제</span></div>
      <div class="hero-progress"><i></i></div>
      <div class="hero-cta">오늘의 복습 시작
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#9A6A30" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
      </div>
      <img class="hero-cat" alt="" src="../assets/demo/quiz-creation-1.webp">
    </div>
    <div class="week-card anim" style="animation-delay:.3s">
      <div class="week-head">
        <div class="week-title">이번 주 복습</div>
        <div class="streak">🔥 연속 4일</div>
      </div>
      <div class="week-days">
        <div class="day done"><i><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></i><span>월</span></div>
        <div class="day done"><i><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></i><span>화</span></div>
        <div class="day done"><i><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></i><span>수</span></div>
        <div class="day done today"><i><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></i><span>목</span></div>
        <div class="day future"><i></i><span>금</span></div>
        <div class="day future"><i></i><span>토</span></div>
        <div class="day future"><i></i><span>일</span></div>
      </div>
    </div>
    <div class="section anim" style="animation-delay:.45s"><h2>내 문제집</h2>
      <div class="add-quiz">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#9A6A30" stroke-width="2.6" stroke-linecap="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
        새 퀴즈 추가
      </div>
    </div>
    <div class="rows">
      <div class="row generating anim" style="animation-delay:.6s">
        <div class="gen-head">
          <div class="gen-cat"><img alt="" src="../assets/demo/quiz-creation-4.gif"></div>
          <div class="mid"><div class="fname">2023 Java 중간 고사.pdf</div><div class="gen-status" id="gen-status">퀴즈 생성 중…</div></div>
        </div>
        <div class="gen-progress"><div class="gen-bar"><i id="gen-fill"></i></div><div class="gen-pct" id="gen-pct">0%</div></div>
      </div>
      <div class="row anim" style="animation-delay:.75s">
        <div class="squircle" style="background:#F5E7D0"><svg width="24" height="24" viewBox="0 0 24 24"><path fill="#C0894A" d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/><path fill="none" stroke="#F5E7D0" stroke-width="2" stroke-linecap="round" d="M12 7v13"/></svg></div>
        <div class="mid"><div class="fname">거시경제학 기말 대비</div><div class="fcount">24문제 · 어제 복습</div></div>
        <svg width="52" height="52" viewBox="0 0 46 46"><circle cx="23" cy="23" r="19" fill="none" stroke="#EDE3CF" stroke-width="5"/><circle cx="23" cy="23" r="19" fill="none" stroke="#C0894A" stroke-width="5" stroke-linecap="round" stroke-dasharray="81.2 119.4" transform="rotate(-90 23 23)"/><text x="23" y="27" text-anchor="middle" font-size="11" font-weight="800" fill="#2F2616">68%</text></svg>
      </div>
      <div class="row anim" style="animation-delay:.9s">
        <div class="squircle" style="background:#EDF0DC"><svg width="24" height="24" viewBox="0 0 24 24"><path fill="#8A9A5A" d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/></svg></div>
        <div class="mid"><div class="fname">정보처리기사 실기 오답</div><div class="fcount">41문제 · 3일 전 복습</div></div>
        <svg width="52" height="52" viewBox="0 0 46 46"><circle cx="23" cy="23" r="19" fill="none" stroke="#EDE3CF" stroke-width="5"/><circle cx="23" cy="23" r="19" fill="none" stroke="#8A9A5A" stroke-width="5" stroke-linecap="round" stroke-dasharray="38.2 119.4" transform="rotate(-90 23 23)"/><text x="23" y="27" text-anchor="middle" font-size="11" font-weight="800" fill="#2F2616">32%</text></svg>
      </div>
    </div>
  </div>
  <div class="tabbar">
    <div class="tab active"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#C0894A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>홈</div>
    <div class="tab"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#B6A68A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="m9 15 2 2 4-4"/></svg>모의고사</div>
    <div class="tab"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="#B6A68A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>설정</div>
  </div>
</div><img class="phone-frame" src="../assets/iphone-frame.png" alt="" aria-hidden="true"></div></div>

<script>
// ── 퀴즈 생성 게이지: STEP 1 데모와 동일하게 0→100 반복 ──
(function () {
  var fill = document.getElementById('gen-fill');
  var pctEl = document.getElementById('gen-pct');
  var statusEl = document.getElementById('gen-status');
  function render(pct) {
    fill.style.width = pct + '%';
    pctEl.textContent = pct + '%';
    var made = Math.floor(pct / 20);
    statusEl.textContent = made > 0 ? '퀴즈 생성 중… ' + made + '개 생성' : '퀴즈 생성 중…';
  }
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    render(65);
    return;
  }
  var pct = 0, hold = 0;
  setInterval(function () {
    if (hold > 0) {            // 100%에서 1.2초 유지 후 0으로 리셋
      if (--hold === 0) { pct = 0; render(0); }
      return;
    }
    pct += 5;
    render(pct);
    if (pct >= 100) hold = 12;
  }, 100);
})();

// ── 뷰포트에 맞게 폰 스케일 (프레임 포함 444.4×904.4, 상단 오버행 26.7) ──
function fit() {
  var s = Math.min(1, (window.innerHeight - 14) / 905, (window.innerWidth - 16) / 445);
  var st = document.getElementById('stage');
  st.style.transform = 'scale(' + s + ')';
  st.style.marginTop = (26.7 * s + 6) + 'px';
}
window.addEventListener('resize', fit);
fit();
</script>
</body>
</html>
