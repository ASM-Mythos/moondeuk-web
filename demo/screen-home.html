<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>문득 — 자동 생성된 문제집 홈</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; overflow:clip; background:transparent; }
  body { font-family:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
    display:flex; flex-direction:column; align-items:center; }

  .stage-wrap { flex:1; display:flex; align-items:flex-start; justify-content:center; }
  .stage { width:393px; height:852px; transform-origin:top center; position:relative; }

  /* ── 폰 프레임: 이미지 베젤(iphone-frame.png) 오버레이, 스크린 393×852 ── */
  .phone { width:393px; height:852px; background:#F2E8D6; border-radius:48px; overflow:hidden; position:relative;
    display:flex; flex-direction:column; box-shadow:0 0 0 8px #F2E8D6; }  /* 베젤 안쪽 반투명 프린지 밑을 채우는 블리드 링 */
  .phone-frame { position:absolute; left:-25.7px; top:-26.7px; width:444.4px; height:904.4px; max-width:none;
    pointer-events:none; z-index:90; filter:drop-shadow(0 10px 18px rgba(47,38,22,.22)); }
  .statusbar { height:44px; flex-shrink:0; }             /* 상태바는 프레임 이미지에 구워져 있음 */
  .content { flex:1; overflow:hidden; padding:0 20px; position:relative; pointer-events:none; }

  .greet-title { margin-top:12px; font-size:24px; font-weight:800; color:#2F2616; letter-spacing:-0.5px; padding-left:2px; white-space:nowrap; }
  .hero { margin-top:14px; border-radius:24px; padding:18px; position:relative; overflow:hidden;
    background:linear-gradient(135deg,#D19A5B 0%,#9A6A30 100%); box-shadow:0 10px 24px rgba(70,60,40,.2); }
  .hero-cap { font-size:12.5px; font-weight:600; color:rgba(255,255,255,.85); }
  .hero-title { font-size:24px; font-weight:800; color:#fff; margin-top:3px; letter-spacing:-0.4px; }
  .hero-total { font-size:16px; font-weight:700; color:rgba(255,255,255,.8); margin-left:2px; }
  .hero-progress { margin-top:10px; width:190px; height:6px; border-radius:4px; background:rgba(255,255,255,.35); overflow:hidden; }
  .hero-progress i { display:block; height:100%; border-radius:4px; background:#fff; width:76%; }
  .hero-cta { display:inline-flex; align-items:center; gap:5px; margin-top:12px; background:#fff; color:#9A6A30; font-size:14px; font-weight:800; padding:10px 16px; border-radius:22px; box-shadow:0 4px 10px rgba(0,0,0,.12); position:relative; }
  .hero-cat { position:absolute; right:10px; bottom:6px; width:98px; filter:drop-shadow(0 4px 8px rgba(0,0,0,.15)); }

  .week-card { margin-top:12px; background:#fff; border-radius:18px; padding:12px 14px; box-shadow:0 2px 10px rgba(47,38,22,.05); }
  .week-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:9px; }
  .week-title { font-size:14px; font-weight:800; color:#2F2616; }
  .streak { display:flex; align-items:center; gap:3px; font-size:12.5px; font-weight:700; color:#9A6A30; }
  .week-days { display:flex; justify-content:space-between; }
  .day { display:flex; flex-direction:column; align-items:center; gap:4px; }
  .day i { width:27px; height:27px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:#F0E9DB; }
  .day span { font-size:10.5px; font-weight:600; color:#8A7C64; }
  .day.done i { background:#C0894A; }
  .day.future i { background:transparent; border:1.5px dashed #DCD2BE; }
  .day.today i { box-shadow:0 0 0 3px rgba(192,137,74,.32); }
  .day.today span { color:#2F2616; font-weight:800; }

  .section { display:flex; justify-content:space-between; align-items:center; margin:18px 2px 12px; }
  .section h2 { font-size:19px; font-weight:800; color:#2F2616; }
  .add-quiz { display:inline-flex; align-items:center; gap:5px; background:#F5E7D0; color:#9A6A30; font-size:13px; font-weight:700; padding:8px 13px; border-radius:17px; border:1.5px solid #C0894A; }

  .rows { display:flex; flex-direction:column; gap:12px; }
  .row { background:#fff; border-radius:20px; padding:16px; display:flex; align-items:center; gap:14px; box-shadow:0 2px 10px rgba(47,38,22,.05); }
  .squircle { width:50px; height:50px; border-radius:16px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .row .mid { flex:1; min-width:0; }
  .row .fname { font-size:16px; font-weight:700; color:#2F2616; letter-spacing:-0.3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row .fcount { font-size:13px; font-weight:500; color:#8A7C64; margin-top:3px; }

  .row.generating { background:#FBF6EC; border:1px solid #E4D5B8; box-shadow:none; display:block; }
  .gen-head { display:flex; align-items:center; }
  .gen-cat { width:44px; height:44px; border-radius:50%; background:#fff; display:flex; align-items:center; justify-content:center; overflow:hidden; flex-shrink:0; box-shadow:0 2px 8px rgba(47,38,22,.08); }
  .gen-cat img { width:44px; height:44px; object-fit:cover; }
  .gen-head .mid { flex:1; min-width:0; padding-left:12px; }
  .gen-status { font-size:13px; font-weight:500; color:#C0894A; margin-top:3px; }
  .gen-progress { margin-top:14px; display:flex; align-items:center; }
  .gen-bar { flex:1; height:6px; border-radius:3px; background:#EDE3CF; overflow:hidden; }
  .gen-bar i { display:block; height:100%; width:0; border-radius:3px; background:#C0894A; transition:width .12s linear; }
  .gen-pct { font-size:13px; font-weight:500; color:#C0894A; padding-left:8px; min-width:38px; text-align:right; }

  .tabbar { height:74px; background:#fff; border-top:1px solid #EFE7D6; display:flex; align-items:flex-start; padding-top:11px; flex-shrink:0; }
  .tab { flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; font-size:11px; font-weight:600; color:#B6A68A; }
  .tab.active { color:#C0894A; font-weight:700; }

  /* ── 등장 애니메이션: 위→아래 순차 ── */
  .anim { opacity:0; transform:translateY(14px); animation:cardIn .6s ease forwards; }
  @keyframes cardIn { to { opacity:1; transform:none; } }
  @media (prefers-reduced-motion: reduce) {
    .anim { animation:none; opacity:1; transform:none; }
  }
</style>
</head>

  }, 100);
})();

// ── 뷰포트에 맞게 폰 스케일 (프레임 포함 444.4×904.4, 상단 오버행 26.7) ──
function fit() {
  var s = Math.min(1, (window.innerHeight - 14) / 905, (window.innerWidth - 16) / 445);
  var st = document.getElementById('stage');
  st.style.transform = 'scale(' + s + ')';
  st.style.marginTop = (26.7 * s + 6) + 'px';
}
window.addEventListener('resize', fit);
fit();
</script>
