<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>문득 — 잠금화면 퀴즈 미리보기</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; overflow:clip; background:transparent; }
  body { font-family:'Pretendard Variable',Pretendard,-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
    display:flex; flex-direction:column; align-items:center; }

  .stage-wrap { flex:1; display:flex; align-items:flex-start; justify-content:center; }
  .stage { width:393px; height:852px; transform-origin:top center; position:relative; }

  /* ── 폰 프레임: 이미지 베젤(iphone-frame.png) 오버레이, 스크린 393×852 ── */
  .phone { width:393px; height:852px; background:#2B2320; border-radius:48px; overflow:hidden; position:relative;
    box-shadow:0 0 0 8px #2B2320; }  /* 베젤 안쪽 반투명 프린지 밑을 채우는 블리드 링 */
  .phone-frame { position:absolute; left:-25.7px; top:-26.7px; width:444.4px; height:904.4px; max-width:none;
    pointer-events:none; z-index:90; filter:drop-shadow(0 10px 18px rgba(47,38,22,.22)); }
  .content { position:absolute; inset:0; padding:0 20px; pointer-events:none; }

  .clock { text-align:center; margin-top:56px; }
  .clock .time { font-size:56px; font-weight:800; color:#fff; letter-spacing:-1.5px; }
  .clock .date { margin-top:4px; font-size:14px; font-weight:600; color:rgba(255,255,255,.7); }

  .brand-chip { display:flex; justify-content:center; margin-top:14px; }
  .brand-chip span { display:inline-flex; align-items:center; gap:6px; background:#F5E7D0; color:#9A6A30; font-size:13px; font-weight:700; padding:7px 14px; border-radius:16px; }

  .q-card { margin-top:108px; background:#fff; border-radius:22px; padding:22px 22px; box-shadow:0 4px 16px rgba(47,38,22,.08); position:relative; }
  .q-text { font-size:18px; font-weight:700; color:#2F2616; line-height:1.5; letter-spacing:-0.3px; }
  .corner-cat { position:absolute; top:-112px; right:-6px; width:104px; height:104px; object-fit:contain; }

  .opt { margin-top:9px; background:#fff; border:1.5px solid #EDE3CF; border-radius:18px; padding:13px 16px; display:flex; align-items:center; gap:12px;
    font-size:14px; font-weight:500; color:#2F2616; line-height:1.4; transition:background .3s, border-color .3s; }
  .q-card + .opt { margin-top:11px; }
  .opt .no { width:26px; height:26px; border-radius:50%; background:#F0E9DB; color:#8A7C64; font-size:12.5px; font-weight:800; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:background .3s; }
  .opt .tail { margin-left:auto; display:none; padding-left:8px; }
  .opt.correct { background:#E9F0E4; border-color:#57A773; }
  .opt.correct .no { background:#57A773; color:#fff; }
  .opt.correct .tail { display:block; }
  .opt.locked { background:#EFEFEF; border-color:transparent; color:#8A7C64; }
  .opt.locked .no { background:#EFEFEF; }

  .confirm-btn { position:absolute; left:20px; right:20px; bottom:28px; height:58px; border-radius:19px;
    background:linear-gradient(135deg,#D19A5B 0%,#9A6A30 100%); color:#fff; font-size:17px; font-weight:800;
    display:flex; align-items:center; justify-content:center; box-shadow:0 8px 18px rgba(154,106,48,.35);
    opacity:0; transition:opacity .35s; }
  .confirm-btn.show { opacity:1; }
  .later { position:absolute; left:0; right:0; bottom:34px; text-align:center; font-size:14.5px; font-weight:600; transition:opacity .3s; }
  .later span { border-bottom:1px solid rgba(255,255,255,.3); padding-bottom:2px; color:rgba(255,255,255,.55); }
  .later.hidden { opacity:0; }

  .pop { animation:popCard .45s cubic-bezier(.2,1.4,.4,1); }
  @keyframes popCard { 0% { transform:scale(1); } 40% { transform:scale(1.05); } 100% { transform:scale(1); } }
  .cat-jump { animation:catJump .9s cubic-bezier(.3,1.6,.4,1); }
  @keyframes catJump { 0%,100% { transform:translateY(0); } 22% { transform:translateY(-24px); } 45% { transform:translateY(0); } 62% { transform:translateY(-12px); } 80% { transform:translateY(0); } }
  .fx-layer { position:absolute; inset:0; pointer-events:none; z-index:60; overflow:hidden; border-radius:48px; }
  .confetti { position:absolute; top:0; left:0; will-change:transform, opacity; }

  @media (prefers-reduced-motion: reduce) {
    .pop, .cat-jump { animation:none; }
  }
</style>
</head>

var $ = function (id) { return document.getElementById(id); };
var ANSWER = 1; // 0-based
var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function burstConfetti(cx, cy) {
  var layer = document.createElement('div');
  layer.className = 'fx-layer';
  document.querySelector('.phone').appendChild(layer);
  var colors = ['#D19A5B', '#57A773', '#F5E7D0', '#D96B5C', '#8A9A5A', '#CF964A'];
  for (var i = 0; i < 22; i++) {
    var p = document.createElement('div');
    p.className = 'confetti';
    var sz = 6 + Math.random() * 5;
    p.style.width = sz + 'px';
    p.style.height = (Math.random() < 0.4 ? sz : sz * 0.55) + 'px';
    p.style.background = colors[i % colors.length];
    p.style.borderRadius = Math.random() < 0.35 ? '50%' : '2px';
    layer.appendChild(p);
    var ang = Math.random() * Math.PI * 2;
    var v = 60 + Math.random() * 120;
    var dx = Math.cos(ang) * v, dy = Math.sin(ang) * v * 0.8 - 55;
    var fall = 220 + Math.random() * 220;
    var rot = Math.random() * 720 - 360;
    p.animate([
      { transform: 'translate(' + cx + 'px,' + cy + 'px) rotate(0deg)', opacity: 1 },
      { transform: 'translate(' + (cx + dx) + 'px,' + (cy + dy) + 'px) rotate(' + rot / 2 + 'deg)', opacity: 1, offset: 0.35 },
      { transform: 'translate(' + (cx + dx * 1.3) + 'px,' + (cy + dy + fall) + 'px) rotate(' + rot + 'deg)', opacity: 0 }
    ], { duration: 1200 + Math.random() * 350, easing: 'cubic-bezier(.15,.6,.4,1)', fill: 'forwards' });
  }
  setTimeout(function () { layer.remove(); }, 1800);
}

function centerOf(el) {
  var pr = document.querySelector('.phone').getBoundingClientRect();
  var r = el.getBoundingClientRect();
  var s = pr.width / 393;
  return { x: (r.left + r.width / 2 - pr.left) / s, y: (r.top + r.height / 2 - pr.top) / s };
}

var opts = document.querySelectorAll('#opts .opt');
function reveal(withFx) {
  opts.forEach(function (o, i) {
    if (i === ANSWER) o.classList.add('correct');
    else o.classList.add('locked');
  });
  $('cat').src = CAT_BULB;
  $('later').classList.add('hidden');
  $('btn-confirm').classList.add('show');
  if (withFx) {
    opts[ANSWER].classList.add('pop');
    $('cat').classList.add('cat-jump');
    var c = centerOf(opts[ANSWER]);
    setTimeout(function () { burstConfetti(c.x, c.y); }, 120);
  }
}
function reset() {
  opts.forEach(function (o) { o.classList.remove('correct', 'locked', 'pop'); });
  $('cat').src = CAT_PONDER;
  $('cat').classList.remove('cat-jump');
  $('later').classList.remove('hidden');
  $('btn-confirm').classList.remove('show');
}

if (reduced) {
  reveal(false); // 정답 공개 상태로 고정
} else {
  setTimeout(function () { reveal(true); }, 1800);
  setInterval(function () {
    reset();
    setTimeout(function () { reveal(true); }, 1800);
  }, 7200);
}

// ── 뷰포트에 맞게 폰 스케일 (프레임 포함 444.4×904.4, 상단 오버행 26.7) ──
function fit() {
  var s = Math.min(1, (window.innerHeight - 14) / 905, (window.innerWidth - 16) / 445);
  var st = $('stage');
  st.style.transform = 'scale(' + s + ')';
  st.style.marginTop = (26.7 * s + 6) + 'px';
}
window.addEventListener('resize', fit);
fit();
</script>
